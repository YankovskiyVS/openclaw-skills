[project]
name = "openclaw-cloudru-export-claude-history"
version = "2.1.3"
description = "Import Claude exports into OpenClaw 2026.7.1 native history without plugins or restarts."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
]

[tool.uv]
package = false

[tool.ruff.lint.isort]
known-first-party = ["claude_import", "import_history", "legacy_gateway"]
